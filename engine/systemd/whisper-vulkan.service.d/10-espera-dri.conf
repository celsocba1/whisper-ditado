# O serviço pode subir antes de a ACL de /dev/dri/renderD128 existir (até ~2 min após o login); sem isso
# o backend Vulkan cai para CPU em silêncio ("no GPU found"). Espera o nó ficar acessível.
[Service]
ExecStartPre=-/bin/sh -c 'i=0; while [ ! -w /dev/dri/renderD128 ] && [ $i -lt 120 ]; do sleep 0.5; i=$((i+1)); done'
